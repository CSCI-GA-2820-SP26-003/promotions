apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: promotion-cd-pipeline
spec:
  params:
    - name: GIT_REPO
      type: string
      description: The URL to the git repo
      default: 'https://github.com/CSCI-GA-2820-SP26-003/promotions.git'
    - name: GIT_REF
      type: string
      description: The reference (branch or ref)
      default: master
    - name: base-url
      type: string
      default: http://promotions:8080
    - name: build-image
      type: string
      description: The fully qualified image name to build and push
      default: image-registry.openshift-image-registry.svc:5000/jkim231-dev/promotions:latest

  workspaces:
    - name: pipeline-workspace

  tasks:
    - name: git-clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.GIT_REPO)
        - name: REVISION
          value: $(params.GIT_REF)
        - name: SUBMODULES
          value: 'true'
        - name: DEPTH
          value: '1'
        - name: SSL_VERIFY
          value: 'true'
        - name: DELETE_EXISTING
          value: 'true'
        - name: VERBOSE
          value: 'false'
        - name: USER_HOME
          value: /home/git
        - name: CRT_FILENAME
          value: ca-bundle.crt
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: lint
      taskRef:
        name: pylint
        kind: Task
      runAfter:
        - git-clone
      params:
        - name: path
          value: service
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: unit-test
      taskRef:
        name: pytest-env
        kind: Task
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: build
      taskRef:
        name: buildah
        kind: Task
      runAfter:
        - unit-test
        - lint
      params:
        - name: IMAGE
          value: "$(params.build-image)"
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      taskRef:
        name: apply-manifests
        kind: Task
      runAfter:
        - build
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: behave-test
      taskRef:
        name: behave
        kind: Task
      runAfter:
        - deploy
      params:
        - name: base-url
          value: $(params.base-url)
      workspaces:
        - name: source
          workspace: pipeline-workspace
