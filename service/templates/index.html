<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotions UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .search-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        button {
            padding: 8px 12px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        .message {
            margin: 16px 0;
            padding: 10px 12px;
            border-radius: 6px;
            display: none;
        }

        .message.info {
            background-color: #eef6ff;
            color: #0b5394;
            border: 1px solid #b6d7ff;
        }

        .message.error {
            background-color: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c2c7;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }

        .promotion-list {
            display: grid;
            gap: 12px;
        }

        .promotion-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            background: #fafafa;
        }

        .promotion-card h3 {
            margin: 0 0 8px 0;
        }

        .promotion-card p {
            margin: 4px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.active {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .badge.inactive {
            background-color: #f8d7da;
            color: #842029;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: #0b5394;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 4px;
        }

        .btn-danger {
            background-color: #b71c1c;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .edit-form {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
        }

        .edit-form label {
            display: block;
            margin-top: 8px;
            font-weight: 600;
        }

        .edit-form input,
        .edit-form select {
            width: 100%;
            margin-top: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <h1>Promotions</h1>
    <h2>Create Promotion</h2>
    <div class="form-row">
        <div>
            <label for="pet_promotion_id">Promotion ID:</label>
            <input type="number" id="pet_promotion_id" />
        </div>
        <div>
            <label for="pet_name">Name:</label>
            <input type="text" id="pet_name" />
        </div>
        <div>
            <label for="pet_promotion_type">Promotion Type:</label>
            <select id="pet_promotion_type">
                <option value="">Select</option>
                <option value="1">PERCENT_OFF</option>
                <option value="2">BUY_N_GET_ONE</option>
                <option value="3">FIXED_DISCOUNT</option>
                <option value="4">FREE_SHIPPING</option>
                <option value="5">PAYBACK_PERCENT</option>
            </select>
        </div>
        <div>
            <label for="pet_value">Value:</label>
            <input type="number" id="pet_value" />
        </div>
        <div>
            <label for="pet_start_date">Start Date:</label>
            <input type="date" id="pet_start_date" />
        </div>
        <div>
            <label for="pet_end_date">End Date:</label>
            <input type="date" id="pet_end_date" />
        </div>
        <div>
            <label for="pet_active">Active:</label>
            <select id="pet_active">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </div>
    </div>

    <button id="create-btn" type="button">Create</button>
    <button id="clear-btn" type="button">Clear</button>
    <button id="retrieve-btn" type="button">Retrieve</button>

    <div id="flash_message" class="message info"></div>
    <div id="search_results" class="promotion-list"></div>

    <script src="{{ url_for('static', filename='js/ui_query_test.js') }}"></script>
</body>

</html>
