<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotions UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .search-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        button {
            padding: 8px 12px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        .message {
            margin: 16px 0;
            padding: 10px 12px;
            border-radius: 6px;
            display: none;
        }

        .message.info {
            background-color: #eef6ff;
            color: #0b5394;
            border: 1px solid #b6d7ff;
        }

        .message.error {
            background-color: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c2c7;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }

        .promotion-list {
            display: grid;
            gap: 12px;
        }

        .promotion-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            background: #fafafa;
        }

        .promotion-card h3 {
            margin: 0 0 8px 0;
        }

        .promotion-card p {
            margin: 4px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.active {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .badge.inactive {
            background-color: #f8d7da;
            color: #842029;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: #0b5394;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 4px;
        }

        .btn-danger {
            background-color: #b71c1c;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .edit-form {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
        }

        .edit-form label {
            display: block;
            margin-top: 8px;
            font-weight: 600;
        }

        .edit-form input,
        .edit-form select {
            width: 100%;
            margin-top: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <h1>Promotions</h1>

    <div class="search-panel">
        <label for="nameFilter">Name:</label>
        <input type="text" id="nameFilter" placeholder="Enter promotion name" />

        <label for="activeFilter">Active Status:</label>
        <select id="activeFilter">
            <option value="">-- Any --</option>
            <option value="true">Active</option>
            <option value="false">Inactive</option>
        </select>

        <button id="searchBtn" type="button">Search</button>
        <button id="clearBtn" type="button">Clear</button>
    </div>

    <div id="messageBox" class="message info"></div>
    <div id="promotionList" class="promotion-list"></div>

    <script src="{{ url_for('static', filename='js/ui_query_test.js') }}"></script>
</body>

</html>
